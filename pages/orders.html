<!-- ORDERS — list page: count tabs, applied filters, sortable table, column picker,
     saved views, row menu, row → drawer, bulk actions, pager.
     Rows are generated by preview.js; each <tr> carries data-status / data-priority / data-customer. -->
<section data-screen="orders" hidden class="f-stack" style="gap:16px">
  <div class="f-head">
    <div><h1 class="f-h1">Orders</h1><p class="f-subtitle"><span data-f-shown>128</span> shown · 5 urgent · <span style="color:var(--danger-fg)">4 breaching SLA today</span></p></div>
    <div class="f-head__actions">
      <button class="f-btn" data-f-menu="#rangeMenu" data-align="end"><svg class="f-i f-i--sm"><use href="#i-calendar"/></svg><span data-f-label>Last 30 days</span><svg class="f-i f-i--sm"><use href="#i-chevron-down"/></svg></button>
      <button class="f-btn f-btn--icon" data-f-menu="#exportMenu" data-align="end" data-tip="Export" aria-label="Export"><svg class="f-i"><use href="#i-download"/></svg></button>
      <button class="f-btn f-btn--primary" data-go="form"><svg class="f-i"><use href="#i-plus"/></svg>New order</button>
    </div>
  </div>

  <div class="f-toolbar">
    <div class="f-chips" data-f-chips id="statusChips">
      <button class="f-chip" aria-pressed="true" data-value="">All <span class="f-chip__n">128</span></button>
      <button class="f-chip" aria-pressed="false" data-value="New">New <span class="f-chip__n">12</span></button>
      <button class="f-chip" aria-pressed="false" data-value="In production">In production <span class="f-chip__n">34</span></button>
      <button class="f-chip" aria-pressed="false" data-value="Waiting">Waiting <span class="f-chip__n">9</span></button>
      <button class="f-chip" aria-pressed="false" data-value="Shipped">Shipped <span class="f-chip__n">61</span></button>
    </div>
    <span class="f-toolbar__grow"></span>
    <span class="f-chip f-chip--alert"><svg class="f-i f-i--sm"><use href="#i-triangle-alert"/></svg>4 breaching SLA today</span>
  </div>

  <div class="f-card f-card--flush" data-f-select="#bulk" id="ordersCard">
    <div class="f-tablehead">
      <label class="f-search" style="background:var(--surface-2);height:calc(38px*var(--density));width:min(280px,100%)"><svg class="f-i f-i--sm"><use href="#i-search"/></svg><input id="orderSearch" placeholder="Search orders, customers…"></label>
      <div class="f-row f-wrap">
        <button class="f-chip f-chip--drop" data-f-menu="#filterPop" data-align="end"><svg class="f-i f-i--sm"><use href="#i-sliders-horizontal"/></svg>Filters<svg class="f-i f-i--sm"><use href="#i-chevron-down"/></svg></button>
        <button class="f-chip f-chip--drop" data-f-menu="#colsMenu" data-align="end"><svg class="f-i f-i--sm"><use href="#i-panel-left"/></svg>Columns<svg class="f-i f-i--sm"><use href="#i-chevron-down"/></svg></button>
        <button class="f-chip f-chip--drop" data-f-menu="#viewsMenu" data-align="end"><svg class="f-i f-i--sm"><use href="#i-inbox"/></svg><span data-f-label>Default view</span><svg class="f-i f-i--sm"><use href="#i-chevron-down"/></svg></button>
      </div>
    </div>
    <div class="f-chips" id="applied" hidden style="padding:0 22px 14px"></div>
    <div class="f-tablewrap"><table class="f-table" id="ordersTable"><thead><tr>
      <th class="f-w1"><input type="checkbox" class="f-check" data-f-all aria-label="Select all"></th>
      <th data-sort>Order</th><th data-sort data-col="customer">Customer</th><th data-sort data-col="priority">Priority</th><th data-sort data-col="status">Status</th>
      <th data-col="owner">Owner</th><th data-sort data-col="age">Age</th><th data-sort data-col="sla">SLA</th><th></th>
    </tr></thead><tbody id="ordersBody"></tbody></table>
      <div class="f-empty" id="ordersEmpty" hidden><span class="f-empty__icon"><svg class="f-i f-i--lg"><use href="#i-search"/></svg></span><h3>No orders match these filters</h3><p>Try removing a filter or searching for something else.</p><div class="f-row"><button class="f-btn" id="clearFilters">Clear filters</button></div></div>
    </div>
    <div class="f-pager"><span>Showing <b data-f-shown>10</b> of 128 orders</span>
      <div class="f-pages"><button aria-label="Previous"><svg class="f-i f-i--sm"><use href="#i-chevron-left"/></svg></button><button aria-current="page">1</button><button>2</button><button>3</button><span class="f-faint">…</span><button>13</button><button aria-label="Next"><svg class="f-i f-i--sm"><use href="#i-chevron-right"/></svg></button></div></div>
  </div>

  <div class="f-bulk" id="bulk" data-f-bulk hidden>
    <b data-f-count>0 selected</b>
    <button class="f-btn f-btn--sm f-btn--on-dark" data-f-menu="#assignMenu"><svg class="f-i f-i--sm"><use href="#i-users"/></svg>Assign</button>
    <button class="f-btn f-btn--sm f-btn--on-dark" data-f-toast="ok|Export started|We will email you the CSV when it is ready."><svg class="f-i f-i--sm"><use href="#i-download"/></svg>Export</button>
    <button class="f-btn f-btn--sm f-btn--on-dark" data-f-open="#confirmDelete"><svg class="f-i f-i--sm"><use href="#i-x"/></svg>Delete</button>
    <button class="f-btn f-btn--sm f-btn--ghost f-btn--icon f-btn--on-dark" data-f-clear aria-label="Clear selection"><svg class="f-i f-i--sm"><use href="#i-x"/></svg></button>
  </div>
</section>
